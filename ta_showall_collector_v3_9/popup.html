<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{width:375px;margin:0;padding:13px 15px 14px;background:#121d2b;color:#eaf4fb;font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
h1{font-size:16px;margin:0 0 8px;color:#b8e986;line-height:1.25}
label{display:block;font-weight:650;margin:8px 0 4px}
input,select{width:100%;padding:7px 9px;background:#203449;color:#f0f5fc;border:1px solid #3b536a;border-radius:6px;font:inherit}
input[type=file]{font-size:11px;padding:5px}
label.fresh{display:flex;align-items:center;gap:7px;font-weight:400;margin:7px 0}
label.fresh input{width:auto;margin:0}
button{padding:8px 10px;min-height:33px;background:#b8e986;color:#132033;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:#29445d;color:#e5f2fa}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.actions #start{grid-column:1/3}
#status{white-space:pre-wrap;line-height:1.35;background:#1c3044;border-radius:6px;padding:8px;margin:8px 0 0;max-height:76px;overflow:auto;font-size:11.5px}
#counts{color:#b8e986;background:#1b2d40;border:1px solid #304963;border-radius:6px;padding:8px;margin:0 0 9px;line-height:1.4;white-space:pre-wrap;font-size:11.5px}
#fileInfo{font-size:11px;color:#aac4d5;margin:4px 0 0;line-height:1.3;max-height:32px;overflow:hidden}
#trophy{grid-column:1/3}
</style></head><body>
<h1>TA Collector v3.9</h1>
<div id="counts">Last saved database: loading…</div>
<label for="database">games.json reference</label>
<input type="file" id="database" accept=".json,application/json">
<div id="fileInfo">Choose your latest games.json.</div>
<label class="fresh"><input type="checkbox" id="fresh"> Fresh start (no existing games.json)</label>
<label for="folder">Download folder</label>
<input id="folder" value="ta-collector" spellcheck="false">
<div class="actions">
 <button id="start" disabled>Start Update</button>
 <button id="stop" class="secondary" disabled>Stop</button>
 <button id="export" class="secondary">Export JSON</button>
 <button id="trophy" class="secondary" disabled>Sync Trophy Case (on Trophy Case page)</button>
</div>
<p id="status">Ready.</p>
<script src="state.js"></script><script src="popup.js"></script>
</body></html>
